<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="飞象 AI 题库 · 排版题单" />
    <title>排版题单 · 飞象 AI 题库</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <link rel="stylesheet" href="./editor.css?v=20260806r" />
  </head>
  <body class="editor-page">
    <header class="editor-topbar">
      <nav class="editor-breadcrumb" aria-label="当前位置">
        <a href="./index.html">首页</a>
        <i class="ri-arrow-right-s-line"></i>
        <a href="./index.html">题库</a>
        <i class="ri-arrow-right-s-line"></i>
        <strong id="breadcrumbLeaf">新建题单</strong>
      </nav>
      <div class="editor-actions" aria-label="题单操作">
        <a class="top-action" id="backLink" href="./index.html"><i class="ri-folder-3-line"></i>返回题库新建</a>
        <button class="top-action accent" data-editor-action="add" type="button"><i class="ri-file-add-line"></i>添加题目</button>
        <button class="top-action" data-editor-action="preview" type="button"><i class="ri-eye-line"></i>预览</button>
        <button class="top-action" data-editor-action="save" type="button"><i class="ri-checkbox-circle-line"></i>完成组题</button>
        <button class="top-action" data-editor-action="download" type="button"><i class="ri-download-2-line"></i>下载</button>
        <button class="top-action" data-editor-action="assign" type="button"><i class="ri-chat-forward-line"></i>发送到对话</button>
        <button class="top-action" data-editor-action="print" type="button"><i class="ri-printer-line"></i>打印</button>
      </div>
    </header>

    <div class="editor-toolbar" aria-label="排版工具">
      <div class="toolbar-group">
        <button type="button" class="toolbar-chip active">五号</button>
        <button type="button" class="toolbar-chip toolbar-metric"><i class="ri-line-height-2"></i><span>1.5</span></button>
        <button type="button" class="toolbar-chip toolbar-metric"><i class="ri-indent-increase"></i><span>1.0</span></button>
      </div>
      <div class="toolbar-group">
        <button type="button" class="toolbar-select">A4竖向单面 <i class="ri-arrow-down-s-line"></i></button>
        <button type="button" class="toolbar-select">AI辅助批改：开启 <i class="ri-arrow-down-s-line"></i></button>
        <button type="button" class="toolbar-select">卷参设置 <i class="ri-arrow-down-s-line"></i></button>
        <button type="button" class="toolbar-select">题目框：隐藏 <i class="ri-arrow-down-s-line"></i></button>
        <button type="button" class="toolbar-select">题单分析 <i class="ri-arrow-down-s-line"></i></button>
      </div>
    </div>

    <main class="editor-shell">
      <aside class="order-panel" aria-label="题目排序">
        <div class="panel-heading">
          <div class="panel-heading-row">
            <h2>题目排序</h2>
            <button class="panel-close" type="button" aria-label="收起排序"><i class="ri-close-line"></i></button>
          </div>
          <div class="order-mode-tabs">
            <button type="button" class="order-mode active">可拖动排序</button>
            <button type="button" class="order-mode">按题型排序</button>
          </div>
        </div>
        <div id="orderList" class="order-list"></div>
      </aside>

      <section class="paper-preview" aria-label="题单预览">
        <div class="paper-preview-scroll">
          <article class="paper-sheet">
            <h1 id="paperTitle" class="paper-title">2026.08.06题单</h1>
            <div id="questionList" class="question-list-editor"></div>
          </article>
        </div>
      </section>

      <aside class="question-info" aria-label="题目信息">
        <div class="info-heading">
          <h2>题目信息</h2>
          <i class="ri-arrow-down-s-line"></i>
        </div>
        <div id="infoContent" class="info-content"></div>
      </aside>

      <button class="deleted-rail" data-editor-action="deleted" type="button">
        <i class="ri-delete-bin-line"></i>
        <span>已删除题目</span>
      </button>
    </main>

    <div id="modalLayer" class="modal-layer" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="question-bank-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-head">
          <div><p id="modalKicker">题库</p><h2 id="modalTitle">从题库添加题目</h2></div>
          <button class="icon-button" data-close-modal type="button" aria-label="关闭"><i class="ri-close-line"></i></button>
        </header>
        <div class="modal-toolbar">
          <div class="modal-search"><i class="ri-search-line"></i><input id="bankSearch" placeholder="搜索题目或知识点" /></div>
          <span>精选题目 · 适配七年级数学</span>
        </div>
        <div id="bankList" class="bank-list"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="./editor.js?v=20260904conversation1"></script>
  </body>
</html>
