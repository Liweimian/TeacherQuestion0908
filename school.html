  </head>
  <body class="school-library-page">
    <aside class="fx-c-sidebar" aria-label="飞象老师主导航">
      <div class="fx-c-demo">demo演示</div>
      <a class="fx-c-logo" href="./index.html" aria-label="飞象老师首页"><span class="fx-c-logo-mark"><i class="ri-flashlight-fill"></i></span><strong>飞象老师</strong></a>
      <button class="fx-c-new-task" type="button"><i class="ri-add-circle-line"></i><span>新任务</span></button>
      <nav class="fx-c-primary-nav" aria-label="核心功能">
        <a href="https://djxky.github.io/fx-community/"><i class="ri-team-line"></i><span>社区</span></a>
        <a class="active" href="./detail-ai.html?workspaceView=home" aria-current="page"><i class="ri-book-open-line"></i><span>题库</span></a>
        <button type="button"><i class="ri-sparkling-2-line"></i><span>教学技能</span></button>
        <button type="button"><i class="ri-graduation-cap-line"></i><span>飞象学院</span></button>
        <button type="button"><i class="ri-book-3-line"></i><span>我的知识库</span></button>
      </nav>
      <div class="fx-c-workspace">
        <div class="fx-c-workspace-title"><span>本地工作区</span><i class="ri-more-line"></i></div>
        <button type="button"><i class="ri-folder-3-line"></i><b>demo-workspace</b></button>
        <button type="button"><i class="ri-add-line"></i><span>新任务</span></button>
        <button type="button"><span>生成期中家长会材料</span><small>刚刚</small></button>
        <button type="button"><span>飞象老师功能简介</span><small>1小时</small></button>
      </div>
      <button class="fx-c-profile" type="button"><span>J</span><b>Joyce22<small>剩余积分：909</small></b><i class="ri-smartphone-line"></i></button>
    </aside>
    <div class="ai-workspace selected-panel-collapsed" id="aiWorkspace">
      <script>
        (function () {
          var root = document.getElementById("aiWorkspace");
          if (!root) return;
          try {
            var saved = localStorage.getItem("feixiang-ai-canvas-panel-v2") || sessionStorage.getItem("feixiang-ai-canvas-panel-v2");
            root.classList.toggle("selected-panel-collapsed", saved !== "0");
          } catch (e) {}
        })();
      </script>
      <aside class="ai-selected-panel" id="aiSelectedPanel" aria-label="正在组题">
        <button class="ai-selected-expand" id="aiSelectedExpand" type="button" aria-label="展开正在组题" onclick="window.AiqCanvas&&window.AiqCanvas.expand&&window.AiqCanvas.expand()">
          <i class="ri-layout-masonry-line"></i>
          <span class="ai-selected-expand-count" id="aiSelectedExpandCount" hidden>0</span>
          <span class="ai-selected-expand-title" id="canvasRailTitle">组题编辑区</span>
        </button>
        <div class="ai-selected-body">
          <header class="ai-section-head" id="selectedSectionHead">
            <div class="ai-section-head-main">
              <div class="ai-canvas-head-title">
                <span class="ai-canvas-head-kicker">组题编辑区</span>
                <i class="ri-arrow-right-s-line" aria-hidden="true"></i>
                <strong id="canvasHeadTitle" contenteditable="true" spellcheck="false">未命名题单</strong>
              </div>
              <span class="ai-selected-hint" id="aiSelectedHint">组题中 · 已选 0 题</span>
            </div>
            <div class="ai-section-head-actions">
              <button type="button" id="toggleSelectedAnswers" hidden>显示答案</button>
              <button type="button" class="panel-action-btn panel-action-btn-compact panel-action-new-draft" data-new-question-draft aria-label="新建题单" title="新建题单"><i class="ri-add-line"></i></button>
              <button type="button" class="panel-action-btn panel-action-btn-compact" id="enlargeSelectedPanel" aria-pressed="false">展开编辑</button>
              <button type="button" class="panel-action-btn panel-action-btn-compact" id="collapseSelectedPanel" aria-label="收起组题编辑区" title="收起组题编辑区">
                <i class="ri-arrow-right-double-line"></i><span>收起</span>
              </button>
            </div>
          </header>
          <nav class="question-draft-tabs" id="questionDraftTabs" aria-label="正在编辑的题单"></nav>
          <div id="aiSelectedContext" class="ai-selected-context">
            <p class="ai-selected-summary" id="aiSelectedSummary" hidden></p>
            <div id="aiSelectedPreview" class="ai-selected-preview"></div>
            <div class="ai-selected-empty" id="aiSelectedEmpty"><strong>当前题单还没有题目</strong><span>请从左侧题目浏览区开始选题，选中的题目会自动加入这里</span></div>
          </div>
          <div class="ai-canvas-studio" id="aiCanvasStudio" hidden>
            <p class="ai-canvas-save-hint" id="canvasEditorSaveHint" hidden><i class="ri-information-line"></i>完成后保存至我的资源，并清空本次组题</p>
            <div class="ai-canvas-studio-toolbar">
              <div class="ai-canvas-toolbar-group">
                <button type="button" class="ai-canvas-chip ai-canvas-add-question" data-open-add-questions><i class="ri-add-line"></i>添加题目</button>
                <button type="button" class="ai-canvas-chip is-active">五号</button>
                <button type="button" class="ai-canvas-chip"><i class="ri-line-height-2"></i>1.5</button>
                <button type="button" class="ai-canvas-chip"><i class="ri-indent-increase"></i>1.0</button>
                <button type="button" class="ai-canvas-chip">A4竖向单面</button>
                <button type="button" class="ai-canvas-chip" data-canvas-action="paper-settings">卷参设置</button>
                <button type="button" class="ai-canvas-chip" data-canvas-action="question-frame">题目框：隐藏</button>
                <button type="button" class="ai-canvas-chip" data-canvas-action="analyze">题单分析</button>
              </div>
            </div>
            <div class="ai-canvas-studio-body">
              <aside class="ai-canvas-order" aria-label="题目排序">
                <div class="ai-canvas-order-head">
                  <strong>题目排序</strong>
                  <div class="ai-canvas-order-tabs">
                    <button type="button" class="is-active" data-canvas-order="drag">可拖动排序</button>
                    <button type="button" data-canvas-order="type">按题型排序</button>
                  </div>
                </div>
                <div id="aiCanvasOrderList" class="ai-canvas-order-list"></div>
              </aside>
              <section class="ai-canvas-paper" aria-label="题单预览">
                <div class="ai-canvas-paper-scroll">
                  <article class="canvas-paper-page">
                    <h1 class="canvas-paper-title" id="canvasPaperTitle" contenteditable="true" spellcheck="false">未命名题单</h1>
                    <div id="aiCanvasPaperList" class="canvas-paper-list"></div>
                  </article>
                </div>
              </section>
              <aside class="ai-canvas-info" aria-label="题目信息">
                <div class="ai-canvas-info-head">
                  <strong>题目信息</strong>
                </div>
                <div id="aiCanvasInfo" class="ai-canvas-info-body"></div>
              </aside>
            </div>
          </div>
          <footer class="ai-selected-footer" id="aiSelectedFooter">
            <div class="ai-selected-footer-actions">
              <p class="ai-canvas-stats" id="aiCanvasStats" hidden>还没有选题</p>
              <button type="button" class="ai-selected-preview-btn" id="clearSelectedQuestions" disabled>
                <i class="ri-delete-bin-line"></i><span>删除</span>
              </button>
              <button type="button" class="ai-selected-preview-btn ai-canvas-wide-btn" id="scoreQuestionList" disabled hidden>
                <i class="ri-medal-line"></i><span>赋分</span>
              </button>
              <button type="button" class="ai-selected-preview-btn" id="previewQuestionList" disabled hidden>
                <i class="ri-printer-line"></i><span id="previewQuestionListLabel">预览</span>
              </button>
              <button type="button" class="ai-selected-create" id="createQuestionList" disabled>
                <i class="ri-save-3-line"></i><span id="createQuestionListLabel">保存</span>
              </button>
              <button type="button" class="ai-selected-preview-btn ai-canvas-wide-btn" data-canvas-action="assign" disabled hidden>
                <i class="ri-chat-forward-line"></i><span>发送到对话</span>
              </button>
              <button type="button" class="ai-selected-preview-btn ai-canvas-wide-btn" data-canvas-action="print" disabled hidden>
                <i class="ri-printer-line"></i><span>打印</span>
              </button>
              <button type="button" class="ai-selected-preview-btn ai-canvas-wide-btn" data-canvas-action="download" disabled hidden>
                <i class="ri-download-2-line"></i><span>下载</span>
              </button>
            </div>
          </footer>
        </div>
      </aside>
      <div class="ai-main-column" id="aiMainColumn">
    <main class="page school-page">
      <header class="discovery site-header school-header" aria-label="题库导航">
        <a class="brand-mark" href="./index.html" aria-label="飞象题库首页">
          <span class="brand-mark-glyph" aria-hidden="true"><i class="ri-sparkling-2-fill"></i></span>
          <span class="brand-mark-copy"><b>飞象题库</b><small>教师资源工作台</small></span>
        </a>
        <nav class="filter-chips category-tabs" aria-label="主要功能">
          <a href="./index.html"><span>首页</span></a>
          <a href="./index.html?filter=chapter"><span>同步练习</span></a>
          <a href="./index.html?filter=workbook"><span>练习册</span></a>
          <a href="./index.html?filter=paper"><span>试卷</span></a>
          <a href="./index.html?filter=special"><span>专题</span></a>
          <span class="category-nav-divider" aria-hidden="true"></span>
          <a class="category-nav-link active" href="./school.html" aria-current="page"><span>章节/知识点选题</span></a>
        </nav>
        <div class="header-tools">
          <div class="context-identity" aria-label="当前教学范围">
            <i class="ri-map-pin-2-line"></i>
            <span>北京市朝阳区</span>
            <i class="context-divider"></i>
            <span>7年级上 数学</span>
          </div>
        </div>
      </header>

      <section class="question-bank-shell" aria-label="题库工作区">
        <aside class="bank-sidebar">
          <div class="bank-side-tabs" role="tablist" aria-label="题库导航方式">
            <button class="active" type="button" role="tab" aria-selected="true" data-side-view="chapters">教材章节</button>
            <button type="button" role="tab" aria-selected="false" data-side-view="knowledge">知识点</button>
          </div>
          <label class="bank-side-search" id="bankSideSearchWrap">
            <i class="ri-search-line"></i>
            <input id="bankSideSearch" type="search" placeholder="请输入搜索关键词" aria-label="搜索章节或知识点" />
          </label>
          <button class="scope-picker" type="button" id="scopePicker" data-chapters-only><span>人教版/七年级上册 (2024)</span><i class="ri-arrow-down-s-line"></i></button>
          <div class="bank-nav-heading"><span>全部资源</span><strong id="bankNavCount">48 题</strong></div>
          <nav id="bankNav" class="bank-nav" aria-label="教材章节导航"></nav>
        </aside>

        <section class="bank-content">
          <header class="bank-content-toolbar">
            <div class="filter-pills" aria-label="题目筛选">
              <label class="filter-pill"><span>题型</span><select id="typeFilter" aria-label="按题型筛选"><option value="all">全部</option><option>单项选择题</option><option>填空题</option><option>解答题</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>难度</span><select id="difficultyFilter" aria-label="按难度筛选"><option value="all">不限</option><option>简单</option><option>较易</option><option>中等</option><option>较难</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>试卷类型</span><select id="paperTypeFilter" aria-label="按试卷类型筛选"><option value="all">全部</option><option>期中</option><option>期末</option><option>月考</option></select><i class="ri-arrow-down-s-line"></i></label>
              <label class="filter-pill"><span>练习册系列</span><select id="seriesFilter" aria-label="按练习册系列筛选"><option value="all">全部</option><option>全品作业本</option><option>多维导学案</option></select><i class="ri-arrow-down-s-line"></i></label>
              <button class="filter-more" type="button" id="filterMore"><i class="ri-equalizer-3-line"></i> 其他</button>
            </div>
          </header>

          <div class="bank-search-row">
            <label class="question-search"><i class="ri-search-line"></i><input id="questionSearch" type="search" placeholder="请输入关键词" aria-label="搜索题目或知识点" /></label>
            <button class="image-search" type="button" id="imageSearch"><i class="ri-camera-line"></i> 图片搜题</button>
          </div>

          <div class="question-heading">
            <div class="question-view-tabs" role="tablist" aria-label="题目排序">
              <button class="active" type="button" role="tab" aria-selected="true" data-sort="recommended">推荐</button>
              <button type="button" role="tab" aria-selected="false" data-sort="latest">最新</button>
            </div>
            <span id="questionCount">共 12 道题</span>
          </div>

          <div id="questionList" class="question-list"></div>
          <div id="questionEmpty" class="question-empty" hidden>
            <i class="ri-search-eye-line"></i>
            <strong>暂时没有符合条件的题目</strong>
            <span>可以切换章节，或减少筛选条件。</span>
          </div>
        </section>

      </section>
    </main>
      </div>
    </div>

    <div id="aiCreateModal" class="ai-create-modal" hidden>
      <div class="ai-create-mask" data-ai-create-close></div>
      <div class="ai-create-panel" role="dialog" aria-modal="true" aria-labelledby="aiCreateTitle">
        <header class="ai-create-head">
          <strong id="aiCreateTitle"><i class="ri-sparkling-2-line"></i>AI 创建题单</strong>
          <button type="button" class="ai-create-close" data-ai-create-close aria-label="关闭"><i class="ri-close-line"></i></button>
        </header>
        <div class="ai-create-body">
          <div class="ai-create-context" id="aiCreateContext" hidden>
            <label class="ai-create-checkbox">
              <input type="checkbox" id="aiCreateUseSelected" checked />
              <span>以已选 <b id="aiCreateSelectedCount">0</b> 题为基础</span>
            </label>
            <p class="ai-create-context-summary" id="aiCreateContextSummary"></p>
          </div>
          <label class="ai-create-field">
            <span>想要什么样的题单？</span>
            <textarea id="aiCreatePrompt" rows="3" placeholder="例如：再补 5 道同类型但难一点的题，总共控制在 12 题"></textarea>
          </label>
          <div class="ai-create-chips" id="aiCreateChips"></div>
        </div>
        <footer class="ai-create-foot">
          <button type="button" class="ai-create-cancel" data-ai-create-close>取消</button>
          <button type="button" class="ai-create-submit" id="aiCreateSubmit"><i class="ri-sparkling-2-line"></i><span>生成题单</span></button>
        </footer>
      </div>
    </div>

    <div id="clearCanvasModal" class="ai-create-modal" hidden>
      <div class="ai-create-mask" data-clear-canvas-close></div>
      <div class="ai-create-panel ai-confirm-panel" role="dialog" aria-modal="true" aria-labelledby="clearCanvasTitle">
        <header class="ai-create-head">
          <strong id="clearCanvasTitle"><i class="ri-error-warning-line"></i>清空本次组题？</strong>
          <button type="button" class="ai-create-close" data-clear-canvas-close aria-label="关闭"><i class="ri-close-line"></i></button>
        </header>
        <div class="ai-create-body">
          <p class="ai-confirm-copy">跨卷选题成本较高，清空后需要重新勾选。确认要清空画布里的全部题目吗？</p>
        </div>
        <footer class="ai-create-foot">
          <button type="button" class="ai-create-cancel" data-clear-canvas-close>取消</button>
          <button type="button" class="ai-confirm-danger" id="confirmClearCanvas">确认清空</button>
        </footer>
      </div>
    </div>

    <div id="canvasPrintPreview" class="canvas-print-preview" hidden>
      <div class="canvas-print-mask" data-print-preview-close></div>
      <div class="canvas-print-stage" role="dialog" aria-modal="true" aria-labelledby="canvasPrintTitle">
        <header class="canvas-print-head">
          <strong id="canvasPrintTitle">打印预览</strong>
          <div class="canvas-print-head-actions">
            <button type="button" class="ai-selected-preview-btn" id="canvasPrintConfirm"><i class="ri-printer-line"></i>打印</button>
            <button type="button" class="ai-selected-preview-btn" data-print-preview-close>关闭</button>
          </div>
        </header>
        <div class="canvas-print-scroll">
          <article class="canvas-print-page" id="canvasPrintPage"></article>
        </div>
      </div>
    </div>

    <div id="schoolToast" class="school-toast" role="status" aria-live="polite"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="./school.js?v=20260825workspacetabs61"></script>
  <script src="./detail-ai.js?v=20260904workbench4"></script>
